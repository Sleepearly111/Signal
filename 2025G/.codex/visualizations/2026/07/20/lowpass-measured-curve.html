<div id="lowpass-measured-curve" style="width:100%;">
  <svg role="img" aria-labelledby="lp-title lp-desc" viewBox="0 0 736 420" style="display:block;width:100%;height:auto;overflow:visible">
    <title id="lp-title">低通滤波器实测点与拟合曲线</title>
    <desc id="lp-desc">展示串口输出的十六个实测增益点，以及K为0.6945、f0为33800赫兹、Q为0.15的二阶低通拟合曲线。</desc>
    <g id="lp-grid"></g>
    <path id="lp-fit" fill="none" stroke="var(--viz-series-1)" stroke-width="2"></path>
    <g id="lp-points"></g>
    <g id="lp-labels"></g>
  </svg>
  <div class="viz-row text-small" style="justify-content:center;gap:18px;margin-top:4px">
    <span><span style="display:inline-block;width:18px;border-top:2px solid var(--viz-series-1);vertical-align:middle;margin-right:6px"></span>二阶拟合曲线</span>
    <span><span style="display:inline-block;width:9px;height:9px;background:var(--viz-series-2);transform:rotate(45deg);margin-right:8px"></span>已提供的实测点</span>
  </div>
  <p class="text-small text-muted" style="text-align:center;margin:8px 0 0">串口抽样点显示 −3 dB 截止频率约在 5 kHz，二阶模型计算值约 5.19 kHz。</p>
</div>
<script>
(() => {
  const root = document.getElementById('lowpass-measured-curve');
  const svg = root.querySelector('svg');
  const ns = 'http://www.w3.org/2000/svg';
  const W=736,H=420,m={l:68,r:22,t:22,b:56},pw=W-m.l-m.r,ph=H-m.t-m.b;
  const x=f=>m.l+(f/60000)*pw;
  const y=g=>m.t+(0.8-g)/0.8*ph;
  const el=(name,attrs,text)=>{const n=document.createElementNS(ns,name);Object.entries(attrs||{}).forEach(([k,v])=>n.setAttribute(k,v));if(text!==undefined)n.textContent=text;return n};
  const grid=root.querySelector('#lp-grid');
  [0,0.2,0.4,0.6,0.8].forEach(v=>{
    grid.appendChild(el('line',{x1:m.l,y1:y(v),x2:W-m.r,y2:y(v),stroke:'var(--border)','stroke-width':'1'}));
    grid.appendChild(el('text',{x:m.l-10,y:y(v)+4,'text-anchor':'end',fill:'var(--muted-foreground)','font-size':'12'},v.toFixed(1)));
  });
  [0,10000,20000,30000,40000,50000,60000].forEach(v=>{
    grid.appendChild(el('line',{x1:x(v),y1:m.t,x2:x(v),y2:H-m.b,stroke:'var(--border)','stroke-width':'1'}));
    grid.appendChild(el('text',{x:x(v),y:H-m.b+23,'text-anchor':'middle',fill:'var(--muted-foreground)','font-size':'12'},v===0?'0':`${v/1000}k`));
  });
  grid.appendChild(el('text',{x:m.l+pw/2,y:H-10,'text-anchor':'middle',fill:'var(--foreground)','font-size':'13'},'频率 (Hz)'));
  grid.appendChild(el('text',{x:17,y:m.t+ph/2,transform:`rotate(-90 17 ${m.t+ph/2})`,'text-anchor':'middle',fill:'var(--foreground)','font-size':'13'},'电压增益 |H(f)|'));
  let d='';
  for(let f=0;f<=60000;f+=200){const q=.15,f0=33800,K=.6945,r=f/f0,g=K/Math.sqrt((1-r*r)**2+(r/q)**2);d+=(f?'L':'M')+x(f).toFixed(2)+' '+y(g).toFixed(2)+' '}
  root.querySelector('#lp-fit').setAttribute('d',d);
  const fc=5190;
  grid.appendChild(el('line',{x1:x(fc),y1:m.t,x2:x(fc),y2:H-m.b,stroke:'var(--viz-series-3)','stroke-width':'2','stroke-dasharray':'5 5'}));
  grid.appendChild(el('text',{x:x(fc)+6,y:m.t+15,fill:'var(--foreground)','font-size':'12'},'−3 dB ≈ 5.19 kHz'));
  const points=[
    {f:1000,g:.7128,label:'1k: 0.7128'}, {f:5000,g:.4855,label:'5k: 0.4855'},
    {f:9000,g:.3328}, {f:13000,g:.2480}, {f:17000,g:.1976},
    {f:21000,g:.1626}, {f:25000,g:.1386}, {f:29000,g:.1205},
    {f:33000,g:.1071}, {f:37000,g:.0958}, {f:41000,g:.0868},
    {f:45000,g:.0793}, {f:49000,g:.0730}, {f:53000,g:.0674},
    {f:57000,g:.0628}, {f:60000,g:.0596,label:'60k: 0.0596'}
  ];
  const pg=root.querySelector('#lp-points'),lg=root.querySelector('#lp-labels');
  points.forEach((p,i)=>{
    const size=6,px=x(p.f),py=y(p.g);
    pg.appendChild(el('rect',{x:px-size/2,y:py-size/2,width:size,height:size,fill:'var(--viz-series-2)',transform:`rotate(45 ${px} ${py})`}));
    if(p.label) lg.appendChild(el('text',{x:i===points.length-1?px-8:px+8,y:py+(i===0?-8:16),'text-anchor':i===points.length-1?'end':'start',fill:'var(--foreground)','font-size':'12'},p.label));
  });
</script>
